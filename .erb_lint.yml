---
EnableDefaultLinters: true
linters:
  AllowedScriptType:
    enabled: true
    exclude:
      - '**/views/shared/_head.html.erb'
  ErbSafety:
    enabled: true
    exclude:
      - '**/views/shared/_head.html.erb'
  Rubocop:
    enabled: true
    rubocop_config:
      plugins:
        - standard-custom
        - standard-performance
        - standard-rails
      inherit_gem:
        standard: config/base.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false
      Rails/OutputSafety:
        Enabled: false
