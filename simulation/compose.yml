name: hunt-sim

x-app: &app
  image: hunt-sim-app
  platform: ${SIM_PLATFORM:-linux/arm64}
  build:
    context: ..
    dockerfile: simulation/Dockerfile
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://scavenger_hunt_party:hunt@db:5432/scavenger_hunt_party
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_SERVE_STATIC_FILES: "1"
    ACTIVE_STORAGE_SERVICE: minio
    MINIO_ENDPOINT: https://storage.scavengerhunt.party
    MINIO_ACCESS_KEY_ID: hunt
    MINIO_SECRET_ACCESS_KEY: huntparty123
    MINIO_BUCKET: scavenger-hunt-party
    VIPS_CONCURRENCY: "1"
    MALLOC_ARENA_MAX: "2"
  volumes:
    - caddy_data:/caddy:ro
  depends_on:
    db:
      condition: service_healthy
    caddy:
      condition: service_started
    minio-setup:
      condition: service_completed_successfully
    push:
      condition: service_started

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: scavenger_hunt_party
      POSTGRES_PASSWORD: hunt
      POSTGRES_DB: scavenger_hunt_party
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scavenger_hunt_party -d scavenger_hunt_party"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: hunt
      MINIO_ROOT_PASSWORD: huntparty123
      MINIO_DEFAULT_BUCKETS: scavenger-hunt-party
      MINIO_API_CORS_ALLOW_ORIGIN: https://www.scavengerhunt.party
    volumes:
      - miniodata:/bitnami/minio/data

  minio-setup:
    image: alpine:3.20
    depends_on:
      - minio
    command: >
      sh -c "for i in $$(seq 1 60); do wget -q --spider http://minio:9000/minio/health/live && exit 0; sleep 2; done; exit 1"

  push:
    build: ./push-stand-in
    env_file: .env
    ports:
      - "8081:8080"

  caddy:
    image: caddy:2
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases:
          - www.scavengerhunt.party
          - storage.scavengerhunt.party
          - fcm.googleapis.com

  web:
    <<: *app
    command: bash -c "bin/rails db:prepare && bin/rails cache:clear && bundle exec puma -C config/puma.rb"
    environment:
      <<: *app-env
      WEB_CONCURRENCY: "2"
      RAILS_MAX_THREADS: "5"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -H 'Host: www.scavengerhunt.party' -H 'X-Forwarded-Proto: https' http://localhost:3000/"]
      interval: 3s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g

  worker:
    <<: *app
    command: bundle exec good_job start --queues="+mailers,priority,default"
    environment:
      <<: *app-env
      GOOD_JOB_THREADS: "8"
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
