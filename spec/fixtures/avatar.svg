<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true"><style>svg:has(.dbcr-medium){--dbcr-t:1;--dbcr-p:running}@media (prefers-reduced-motion: no-preference){@keyframes dbcrBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}} .dbcr-c{transform-box:fill-box;animation:dbcrBob calc(var(--dbcr-t,1)*3.4s) ease-in-out infinite}.dbcr-c{animation-play-state:var(--dbcr-p,paused)}}</style><rect width="100" height="100" fill="#0369a1"/><g class="dbcr-c dbcr-medium"><circle cx="50" cy="50" r="30" fill="#fcd34d"><animate attributeName="r" values="30;32;30" dur="3s" repeatCount="indefinite"/></circle><path class="eyes" d="M40 45h4M56 45h4" stroke="#1e293b" stroke-width="3"/></g></svg>
