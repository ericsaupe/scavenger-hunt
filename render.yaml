services:
  - type: web
    name: scavenger_hunt_web
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    region: oregon
    plan: standard
    branch: main
    autoDeployTrigger: commit
    domains:
      - www.scavengerhunt.party
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scavenger_hunt_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
  - type: worker
    name: scavenger_hunt_worker
    runtime: ruby
    buildCommand: "bundle install"
    startCommand: 'bundle exec good_job start --threads=10 --queues="+mailers,priority,default"'
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scavenger_hunt_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        fromService:
          type: web
          name: scavenger_hunt_web
          envVarKey: RAILS_MASTER_KEY

databases:
  - name: scavenger_hunt_db
    databaseName: scavenger_hunt_party
    user: scavenger_hunt_party
    region: oregon
    plan: basic-1gb
    diskSizeGB: 1
    postgresMajorVersion: "18"
