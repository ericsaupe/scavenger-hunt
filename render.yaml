services:
  - type: web
    name: scavenger_hunt_web
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    region: oregon
    plan: standard
    branch: main
    autoDeployTrigger: commit
    domains:
      - www.scavengerhunt.party
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scavenger_hunt_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: VIPS_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
  - type: worker
    name: scavenger_hunt_worker
    runtime: ruby
    buildCommand: "bundle install"
    startCommand: 'bundle exec good_job start --queues="+mailers,priority,default"'
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scavenger_hunt_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        fromService:
          type: web
          name: scavenger_hunt_web
          envVarKey: RAILS_MASTER_KEY
      - key: GOOD_JOB_THREADS
        value: "5"
      - key: VIPS_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"

databases:
  - name: scavenger_hunt_db
    databaseName: scavenger_hunt_party
    user: scavenger_hunt_party
    region: oregon
    plan: basic-256mb
    diskSizeGB: 1
    postgresMajorVersion: "18"
